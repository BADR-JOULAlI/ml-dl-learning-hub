<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" role="img" aria-labelledby="title description">
  <title id="title">Cycle complet d'un projet de machine learning</title>
  <desc id="description">Huit étapes en deux lignes : cadrer, collecter, séparer, préparer, entraîner, évaluer, déployer, surveiller. Une flèche de retour relie la surveillance au cadrage. Les transformations sont ajustées sur train uniquement et le test est réservé à la fin.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="450" fill="#f8fafc"/>
  <text x="35" y="42" fill="#0f172a" font-size="26" font-weight="700" font-family="Arial, sans-serif">Du problème aux prédictions suivies</text>
  <text x="35" y="70" fill="#475569" font-size="15" font-family="Arial, sans-serif">Un cycle de projet ; le prétraitement et le modèle restent réunis dans une même pipeline.</text>

  <path d="M315 157 H340" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M625 157 H650" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M935 157 H960" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1105 210 V280" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M965 338 H940" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M655 338 H630" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M345 338 H320" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M35 338 H17 V157 H30" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="35" y="105" width="280" height="105" rx="15" fill="#eaf4ff" stroke="#8ab8eb" stroke-width="1.5"/>
  <circle cx="65" cy="137" r="17" fill="#175e9e"/>
  <text x="65" y="143" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="Arial, sans-serif">1</text>
  <text x="94" y="143" fill="#12375d" font-size="18" font-weight="700" font-family="Arial, sans-serif">Cadrer</text>
  <text x="55" y="177" fill="#264665" font-size="15" font-family="Arial, sans-serif">Question, cible, coût d'erreur</text>

  <rect x="345" y="105" width="280" height="105" rx="15" fill="#e9f7f1" stroke="#8bcdb0" stroke-width="1.5"/>
  <circle cx="375" cy="137" r="17" fill="#187553"/>
  <text x="375" y="143" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="Arial, sans-serif">2</text>
  <text x="404" y="143" fill="#184c3b" font-size="18" font-weight="700" font-family="Arial, sans-serif">Collecter et auditer</text>
  <text x="365" y="177" fill="#285747" font-size="15" font-family="Arial, sans-serif">Qualité, doublons, EDA</text>

  <rect x="655" y="105" width="280" height="105" rx="15" fill="#f0efff" stroke="#b5a8e8" stroke-width="1.5"/>
  <circle cx="685" cy="137" r="17" fill="#5a49a8"/>
  <text x="685" y="143" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="Arial, sans-serif">3</text>
  <text x="714" y="143" fill="#392e71" font-size="18" font-weight="700" font-family="Arial, sans-serif">Séparer</text>
  <text x="675" y="177" fill="#4a427b" font-size="15" font-family="Arial, sans-serif">Train / validation / test</text>

  <rect x="965" y="105" width="280" height="105" rx="15" fill="#fff3e8" stroke="#e9b889" stroke-width="1.5"/>
  <circle cx="995" cy="137" r="17" fill="#a45118"/>
  <text x="995" y="143" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="Arial, sans-serif">4</text>
  <text x="1024" y="143" fill="#693915" font-size="18" font-weight="700" font-family="Arial, sans-serif">Préparer</text>
  <text x="985" y="173" fill="#75471f" font-size="15" font-family="Arial, sans-serif">Imputer, encoder, scaler</text>
  <text x="985" y="195" fill="#8c4213" font-size="13" font-weight="700" font-family="Arial, sans-serif">fit uniquement sur train</text>

  <rect x="965" y="285" width="280" height="105" rx="15" fill="#fff3e8" stroke="#e9b889" stroke-width="1.5"/>
  <circle cx="995" cy="317" r="17" fill="#a45118"/>
  <text x="995" y="323" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="Arial, sans-serif">5</text>
  <text x="1024" y="323" fill="#693915" font-size="18" font-weight="700" font-family="Arial, sans-serif">Entraîner et choisir</text>
  <text x="985" y="357" fill="#75471f" font-size="15" font-family="Arial, sans-serif">CV sur train ; choix sur validation</text>

  <rect x="655" y="285" width="280" height="105" rx="15" fill="#f0efff" stroke="#b5a8e8" stroke-width="1.5"/>
  <circle cx="685" cy="317" r="17" fill="#5a49a8"/>
  <text x="685" y="323" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="Arial, sans-serif">6</text>
  <text x="714" y="323" fill="#392e71" font-size="18" font-weight="700" font-family="Arial, sans-serif">Évaluer</text>
  <text x="675" y="357" fill="#4a427b" font-size="15" font-family="Arial, sans-serif">Test final, une seule fois</text>

  <rect x="345" y="285" width="280" height="105" rx="15" fill="#e9f7f1" stroke="#8bcdb0" stroke-width="1.5"/>
  <circle cx="375" cy="317" r="17" fill="#187553"/>
  <text x="375" y="323" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="Arial, sans-serif">7</text>
  <text x="404" y="323" fill="#184c3b" font-size="18" font-weight="700" font-family="Arial, sans-serif">Déployer</text>
  <text x="365" y="357" fill="#285747" font-size="15" font-family="Arial, sans-serif">Même pipeline pour l'inférence</text>

  <rect x="35" y="285" width="280" height="105" rx="15" fill="#eaf4ff" stroke="#8ab8eb" stroke-width="1.5"/>
  <circle cx="65" cy="317" r="17" fill="#175e9e"/>
  <text x="65" y="323" text-anchor="middle" fill="white" font-size="16" font-weight="700" font-family="Arial, sans-serif">8</text>
  <text x="94" y="323" fill="#12375d" font-size="18" font-weight="700" font-family="Arial, sans-serif">Surveiller</text>
  <text x="55" y="355" fill="#264665" font-size="15" font-family="Arial, sans-serif">Drift, erreurs, labels différés</text>
  <text x="35" y="424" fill="#475569" font-size="13" font-family="Arial, sans-serif">Boucle de retour : de nouvelles données ou erreurs observées peuvent conduire à une nouvelle expérience.</text>
</svg>
