[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-dl-learning-hub"
version = "0.1.0"
description = "Parcours francophone ouvert pour apprendre le Machine Learning et le Deep Learning"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "scikit-learn>=1.4,<2",
  "jupyterlab>=4.1,<5",
  "ipykernel>=6.29,<7",
]

[project.optional-dependencies]
dl = ["torch>=2.2", "torchvision>=0.17"]
api = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.29,<1", "joblib>=1.3"]
mlops = ["mlflow>=2.12,<4", "fastapi>=0.110,<1", "uvicorn[standard]>=0.29,<1", "joblib>=1.3", "httpx>=0.27,<1"]
nlp = ["nltk>=3.8,<4", "wordcloud>=1.9,<2"]
parquet = ["pyarrow>=14,<30"]
dev = ["pytest>=8,<9", "ruff>=0.4,<1", "nbformat>=5.10,<6", "nbclient>=0.10,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
